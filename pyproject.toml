[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionpatch"
version = "0.2.0"
description = "定了吗？DecisionPatch — 从成员纠正中学习的小组决策记忆 Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DecisionPatch Team" }]
dependencies = [
    "streamlit>=1.36,<2.0",
    "pydantic>=2.7,<3.0",
    "openai>=1.35,<2.0",
    "faster-whisper>=1.2,<2.0",
    "numpy>=1.26,<3.0",
    "rapidocr>=3.9,<4.0",
    "onnxruntime>=1.23,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"

[tool.setuptools]
# Single-file entry + package dirs; we use a flat layout.
py-modules = ["app", "config"]
