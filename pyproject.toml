[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptlint-feedback-agent"
version = "0.4.0"
description = "ScriptLint — video audio review and feedback-memory agent for short dramas"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ScriptLint Demo Team" }]
dependencies = [
    "streamlit>=1.36,<2.0",
    "pydantic>=2.7,<3.0",
    "openai>=1.35,<2.0",
    "faster-whisper>=1.2,<2.0",
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"

[tool.setuptools]
# Single-file entry + package dirs; we use a flat layout.
py-modules = ["app", "config", "scriptlint_app"]
